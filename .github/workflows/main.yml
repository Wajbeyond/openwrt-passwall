```yaml
name: Build GeoView 0.2.7 ARM64

on:
  workflow_dispatch:

jobs:
  build-geoview:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            xz-utils \
            zstd

      - name: Download OpenWrt 24.10.5 SDK
        run: |
          wget -q \
            https://downloads.openwrt.org/releases/24.10.5/targets/mediatek/filogic/openwrt-sdk-24.10.5-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst \
            -O sdk.tar.zst

          mkdir sdk

          tar --use-compress-program=unzstd \
            -xf sdk.tar.zst \
            -C sdk \
            --strip-components=1

      - name: Clone PassWall packages
        run: |
          git clone \
            --depth=1 \
            https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git \
            sdk/package/passwall-packages

      - name: Compile GeoView
        run: |
          cd sdk

          make defconfig

          make package/passwall-packages/geoview/compile V=s

      - name: Check result
        run: |
          echo "===== GeoView IPK ====="
          find bin/packages \
            -type f \
            -name 'geoview*.ipk' \
            -print

          echo "===== SHA256 ====="
          find bin/packages \
            -type f \
            -name 'geoview*.ipk' \
            -exec sha256sum {} \;

      - name: Upload GeoView IPK
        uses: actions/upload-artifact@v4
        with:
          name: geoview-0.2.7-aarch64-cortex-a53
          path: |
            sdk/bin/packages/aarch64_cortex-a53/**/geoview*.ipk
```
